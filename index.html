<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
@keyframes fadeIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
:root {
  --bg: #f8f6f1; --surface: #ffffff; --surface2: #f0ede7;
  --gold: #c9950e; --gold-dim: #a0760a; --green: #16a34a;
  --blue: #2563eb; --red: #dc2626; --purple: #a855f7;
  --text: #1a1a2e; --text2: #6b7280; --border: #e2ddd3;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(rgba(201,149,14,0.03) 1px,transparent 1px);background-size:30px 30px}
a{color:var(--gold);text-decoration:none}

/* Nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;height:54px;padding:0 1.5rem;gap:0.25rem;overflow:visible}
.nav a,.nav-link{color:var(--text2);font-size:.82rem;font-weight:500;padding:.35rem .65rem;border-radius:8px;cursor:pointer;white-space:nowrap;transition:all .15s}
.nav a:hover,.nav-link:hover{color:var(--gold);background:rgba(201,149,14,.08)}
.nav-brand{font-weight:800;color:var(--gold)!important;margin-right:.5rem;font-size:.88rem}
.nav-teams{position:relative}
.nav-drop{display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:12px;max-height:60vh;overflow-y:auto;min-width:260px;z-index:9999;padding:.4rem;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.nav-teams:hover .nav-drop,.nav-drop:hover{display:block}
.nav-drop a{display:flex;align-items:center;gap:.4rem;padding:.35rem .6rem;border-radius:6px;font-size:.75rem;color:var(--text);white-space:nowrap}
.nav-drop a:hover{background:var(--surface2)}

/* Hero */
.hero{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6rem 2rem 3rem;position:relative;background:linear-gradient(160deg,#fdf6e3 0%,#fff8e7 20%,#e8f0fe 50%,#fef2f2 80%,#fdf6e3 100%);position:relative}
.hero-imgs{display:flex;align-items:center;gap:clamp(1rem,3vw,2.5rem);margin-bottom:1rem}
.hero-emblem{width:clamp(80px,12vw,140px);height:auto;animation:fadeIn 1s ease-out}
.hero-trophy{width:clamp(50px,8vw,100px);height:auto;animation:fadeIn 1s ease-out 0.2s both;filter:drop-shadow(0 2px 8px rgba(0,0,0,.2))}
.hero h1{font-size:clamp(2.8rem,7vw,6rem);font-weight:900;background:linear-gradient(135deg,#fbbf24,#f59e0b,#b8860b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.05;letter-spacing:-1px}
.hero h2{font-size:clamp(.9rem,2vw,1.3rem);color:var(--text2);font-weight:400;margin-top:.8rem}
.hero-info{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;margin-top:1.2rem}
.hero-info span{padding:.4rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:100px;font-size:.82rem;color:var(--text2);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.hero-flags{display:flex;gap:.6rem;margin-top:1rem;font-size:1.8rem}

#groups-section{max-width:1400px;margin:0 auto;padding:0 2rem 3rem}

/* Section */
.section{max-width:1400px;margin:0 auto;padding:4rem 2rem 3rem}
.section-title{font-size:1.6rem;font-weight:800;margin-bottom:.25rem;display:flex;align-items:center;gap:.6rem;position:relative}
.section-sub{color:var(--text2);margin-bottom:2rem;font-size:.95rem;padding-bottom:.8rem;border-bottom:2px solid rgba(201,149,14,.12)}

/* Groups */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:1.2rem}
.g-card{background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);border-radius:14px;transition:transform .2s}
.g-card:hover{transform:translateY(-2px)}
.g-hdr{padding:.85rem 1.1rem;font-weight:700;font-size:1rem;background:linear-gradient(135deg,rgba(201,149,14,.08),rgba(37,99,235,.04));border-bottom:1px solid var(--border);display:flex;justify-content:space-between;position:relative}
.g-hdr span{font-weight:400;font-size:.7rem;color:var(--text2)}
.t-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:.6rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.04);font-size:.85rem;cursor:pointer;transition:background .15s}
.t-row:last-child{border:none}
.t-row:hover{background:rgba(201,149,14,.05)}
.t-flag{font-size:1.1rem}
.t-name{font-weight:600}
.t-badge{font-size:.6rem;padding:1px 6px;border-radius:4px;margin-left:4px}
.t-badge.h{background:rgba(201,149,14,.1);color:var(--gold)}
.t-badge.d{background:rgba(22,163,74,.12);color:var(--green)}
.t-mini{padding:.5rem 1.1rem;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:.25rem}
.t-mini span{font-size:.6rem;color:var(--text2);background:var(--surface2);padding:2px 6px;border-radius:4px}

/* Fixtures */
.f-list{display:flex;flex-direction:column;gap:.5rem}
.f-card{background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);border-radius:10px;padding:.75rem 1.1rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.f-date{min-width:80px;font-weight:600;color:var(--gold);font-size:.82rem;display:flex;align-items:center;gap:.3rem}
.f-teams{flex:1;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.f-team{font-weight:600;cursor:pointer}
.f-team:hover{color:var(--gold)}
.f-vs{color:var(--text2);font-size:.78rem}
.f-info{font-size:.78rem;color:var(--text2);display:flex;align-items:center;gap:.4rem;margin-left:auto}
.f-round{font-size:.72rem;background:rgba(37,99,235,.1);color:var(--blue);padding:2px 8px;border-radius:6px}

/* Venues */
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.8rem}
.v-card{background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);border-radius:10px;padding:1rem}
.v-card h4{font-size:.95rem;margin-bottom:.2rem}
.v-city{color:var(--text2);font-size:.82rem}
.v-cap{font-size:.78rem;color:var(--gold);margin-top:.3rem}
.v-country{font-size:.72rem;display:inline-block;padding:2px 8px;border-radius:6px;margin-top:.4rem}
.v-country.us{background:rgba(37,99,235,.1);color:var(--blue)}
.v-country.mx{background:rgba(22,163,74,.12);color:var(--green)}
.v-country.ca{background:rgba(220,38,38,.1);color:var(--red)}

/* Teams Cloud */
.t-cloud{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}
.t-tag{padding:.4rem .9rem;background:var(--surface);border:1px solid var(--border);border-radius:100px;font-size:.82rem;font-weight:500;display:flex;align-items:center;gap:.35rem;cursor:pointer;transition:all .15s}
.t-tag:hover{border-color:var(--gold);transform:translateY(-1px)}
.t-tag.dbut{border-color:rgba(22,163,74,.15);background:rgba(22,163,74,.04)}
.t-tag .d-tag{font-size:.58rem;background:rgba(22,163,74,.15);color:var(--green);padding:1px 5px;border-radius:4px}

/* Knockout */
.ko-grid{display:flex;justify-content:center;gap:.8rem;flex-wrap:wrap}
.ko-card{background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);border-radius:10px;padding:.9rem 1.1rem;min-width:140px;text-align:center}
.ko-card h4{font-size:.82rem;color:var(--gold);margin-bottom:.3rem}
.ko-card p{font-size:.78rem;color:var(--text2)}
.ko-card .ko-v{font-size:.72rem;color:var(--text2);margin-top:.2rem}
.ko-card.final{border-color:var(--gold)}

/* Team Detail */
.td-hdr{display:flex;align-items:center;gap:1.2rem;margin-bottom:1.5rem;flex-wrap:wrap;position:relative}
.td-flag{font-size:4.5rem;filter:drop-shadow(0 4px 12px rgba(0,0,0,.15));border-radius:8px}
.td-name{font-size:1.8rem;font-weight:800}
.td-meta{color:var(--text2);font-size:.95rem}
.td-meta span{margin-right:1.2rem}
.td-grp{color:var(--gold);font-weight:600}
.sq-sec{margin-top:1.5rem}
.sq-sec h3{font-size:1.1rem;font-weight:700;margin:1.2rem 0 .6rem;display:flex;align-items:center;gap:.4rem}
.pos{font-size:.65rem;padding:2px 8px;border-radius:6px}
.pos.gk{background:rgba(220,38,38,.1);color:var(--red)}
.pos.df{background:rgba(37,99,235,.1);color:var(--blue)}
.pos.mf{background:rgba(22,163,74,.12);color:var(--green)}
.pos.fw{background:rgba(201,149,14,.1);color:var(--gold)}
.sq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.5rem}
.p-card{background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);border-radius:8px;padding:.6rem .9rem;display:flex;align-items:center;gap:.6rem}
.p-num{font-weight:700;color:var(--text2);font-size:.75rem;min-width:1.4rem}
.p-name{font-weight:600;flex:1}
.p-kanji{font-size:.7rem;color:var(--text2);font-weight:400;display:block}
.p-club{font-size:.72rem;color:var(--text2)}
.sq-status{padding:.8rem 1.2rem;background:var(--surface2);border-radius:10px;margin-top:.8rem;font-size:.9rem}
.sq-status.ok{border-left:3px solid var(--green)}
.sq-status.pd{border-left:3px solid var(--gold)}

/* Filters */
.filt{display:flex;gap:.4rem;margin-bottom:1.2rem;flex-wrap:wrap}
.filt-tab{padding:.35rem .9rem;border-radius:100px;font-size:.78rem;cursor:pointer;background:var(--surface2);color:var(--text2);border:1px solid transparent;transition:all .15s}
.filt-tab:hover{border-color:var(--border)}
.filt-tab.active{background:rgba(201,149,14,.08);color:var(--gold);border-color:rgba(201,149,14,.3)}

/* Back link */
.back{display:inline-flex;align-items:center;gap:.35rem;color:var(--text2);font-size:.82rem;margin-bottom:1.2rem;cursor:pointer}
.back:hover{color:var(--gold)}

/* Pages */
.page{display:none;animation:fadeIn .3s ease-out}
.page.active{display:block}

footer{text-align:center;padding:2.5rem 2rem;color:var(--text2);font-size:.8rem;border-top:1px solid var(--border);margin-top:2rem}

@media(max-width:640px){
  .groups-grid{grid-template-columns:1fr}
  .v-grid{grid-template-columns:1fr}
  .hero h1{font-size:2.2rem}
  .f-card{flex-direction:column;align-items:flex-start}
  .f-info{margin-left:0}
  .nav{padding:0 .8rem;overflow-x:auto;overflow-y:visible}
  .sq-grid{grid-template-columns:1fr}
}
</style>
</head>

</div>

<div class="page" id="pteam">
  <div class="section">

<div class="page" id="pvenues">

function filF(g){document.querySelectorAll('#ffilt .filt-tab').forEach(t=>t.classList.toggle('active',t.dataset.g===g));document.getElementById('fix').innerHTML=FX.filter(f=>g==='all'||f.g===g).map(f=>'<div class="f-card"><span class="f-date">'+f.d+'</span><div class="f-teams"><span class="f-team" onclick="openT(\''+f.a+'\')">'+f.a+'</span><span class="f-vs">vs</span><span class="f-team" onclick="openT(\''+f.b+'\')">'+f.b+'</span></div><div class="f-info"><span class="f-round">G'+f.g+'</span><span>'+f.v+'</span></div></div>').join('')}

document.getElementById('grp').innerHTML=GR.map(g=>'<div class="g-card"><div class="g-hdr">Group '+g.l+'<span>P W D L GD Pts</span></div>'+g.t.map(t=>'<div class="t-row" onclick="openT(\''+t.n+'\')"><span class="t-flag">'+t.f+'</span><span class="t-name">'+t.n+(t.h?'<span class="t-badge h">HOST</span>':'')+(t.d?'<span class="t-badge d">DEBUT</span>':'')+'</span><span style="font-size:.72rem;color:var(--text2)">'+(SK[t.n]?'✅':'⏳')+'</span></div>').join('')+'<div class="t-mini">'+FX.filter(f=>f.g===g.l).map(f=>'<span>'+f.a.slice(0,10)+' vs '+f.b.slice(0,10)+'</span>').join('')+'</div></div>').join('')

var ff=document.getElementById('ffilt');ff.innerHTML='<span class="filt-tab active" data-g="all">全部</span>';'ABCDEFGHIJKL'.split('').forEach(l=>ff.innerHTML+='<span class="filt-tab" data-g="'+l+'">'+l+'</span>')
ff.querySelectorAll('.filt-tab').forEach(t=>t.onclick=function(){filF(this.dataset.g)})
filF('all')

var tc=document.getElementById('teams');AL.sort((a,b)=>a.n.localeCompare(b.n))
tc.innerHTML=AL.map(t=>'<span class="t-tag" onclick="openT(\''+t.n+'\')">'+t.f+' '+t.n+'</span>').join('')

document.getElementById('ven').innerHTML=VN.map(v=>'<div class="v-card"><div class="v-card-top '+v.t+'">'+{us:'🇺🇸',mx:'🇲🇽',ca:'🇨🇦'}[v.t]+'</div><div class="v-body"><h4>'+v.n+'</h4><div class="v-city">'+v.c+'</div><div class="v-cap">👥 '+v.p+'</div>'+(v.x?'<div class="v-badge">'+v.x+'</div>':'')+'</div></div>').join('')

document.getElementById('ko').innerHTML=[{n:'R32',d:'Jun 28–Jul 3'},{n:'R16',d:'Jul 4–7'},{n:'QF',d:'Jul 9–11'},{n:'SF',d:'Jul 14–15',v:'Dallas / Atlanta'},{n:'3rd',d:'Jul 18',v:'Hard Rock'},{n:'🏆 FINAL',d:'Jul 19',v:'MetLife Stadium'}].map(r=>'<div class="ko-card'+(r.n.includes('FINAL')?' final':'')+'"><h4>'+r.n+'</h4><p>'+r.d+'</p>'+(r.v?'<div class="ko-v">'+r.v+'</div>':'')+'</div>').join('')

document.getElementById('drop').innerHTML=AL.sort((a,b)=>a.n.localeCompare(b.n)).map(t=>'<a onclick="openT(\''+t.n+'\')">'+t.f+' '+t.n+' '+(SK[t.n]?'✅':'⏳')+'</a>').join('')
</script>
